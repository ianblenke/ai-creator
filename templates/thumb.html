<!doctype html>
<html><head><meta charset="utf-8"><title>Episode thumbnail</title>
<!-- Thumbnail template: tools/thumbnail.js renders it at 1280x720, one PNG per variant (?v=a, ?v=b ...). Put your art next to this file
     and add an <img>; keep the words to three or four, large. The fonts are the repo's vendored ones, so renders match everywhere. -->
<style>
@font-face { font-family: 'Noto Sans'; font-weight: 700; src: url('../../../vendor/fonts/NotoSans-Bold.ttf'); }
@font-face { font-family: 'Noto Sans Mono'; font-weight: 700; src: url('../../../vendor/fonts/NotoSansMono-Bold.ttf'); }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b0d10; }
.text { position: absolute; left: 80px; right: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
.tag { font: 700 30px 'Noto Sans Mono'; color: #ff2e9a; letter-spacing: 2px; margin-bottom: 18px; }
h1 { margin: 0; font: 700 112px/1.0 'Noto Sans'; color: #eef2f4; letter-spacing: -2px; text-transform: uppercase; }
h1 em { font-style: normal; color: #b6ff3c; }
.bar { width: 120px; height: 12px; background: #b6ff3c; margin-top: 26px; }
</style></head>
<body>
<div class="text">
  <div class="tag">SERIES TAG</div>
  <h1 id="h">THE <em>ONE</em><br>IDEA</h1>
  <div class="bar"></div>
</div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
document.body.className = v;
if (v === 'b') document.getElementById('h').innerHTML = 'ANOTHER<br><em>WORDING</em>';
</script>
</body></html>
