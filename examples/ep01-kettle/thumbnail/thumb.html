<!doctype html>
<html><head><meta charset="utf-8"><title>Kettle thumbnail</title>
<style>
@font-face { font-family: 'Noto Sans'; font-weight: 700; src: url('../../../vendor/fonts/NotoSans-Bold.ttf'); }
@font-face { font-family: 'Noto Sans Mono'; font-weight: 700; src: url('../../../vendor/fonts/NotoSansMono-Bold.ttf'); }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b0d10; }
.art { position: absolute; left: -330px; top: 0; height: 720px; }
.fade { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 40%, #0b0d10 47%); }
.text { position: absolute; left: 625px; right: 40px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
.tag { font: 700 30px 'Noto Sans Mono'; color: #ff2e9a; letter-spacing: 2px; margin-bottom: 18px; }
h1 { margin: 0; font: 700 112px/1.0 'Noto Sans'; color: #eef2f4; letter-spacing: -2px; text-transform: uppercase; }
h1 em { font-style: normal; color: #b6ff3c; }
.bar { width: 120px; height: 12px; background: #b6ff3c; margin-top: 26px; }
/* variant b: alternate wording */
body.b h1 { font-size: 104px; }
</style></head>
<body>
<img class="art" src="kettle.png" alt="">
<div class="fade"></div>
<div class="text">
  <div class="tag" id="tag">HOW A KETTLE KNOWS</div>
  <h1 id="h"><em>STEAM</em><br>FLIPS THE<br>SWITCH</h1>
  <div class="bar"></div>
</div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
document.body.className = v;
if (v === 'b') document.getElementById('h').innerHTML = 'IT WAITS<br>FOR THE<br><em>STEAM</em>';
</script>
</body></html>
